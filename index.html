<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePool — Curadoria & Crítica Cinematográfica</title>
  
  <!-- Google Fonts: Tipografia cinematográfica e moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome para ícones de UI e Redes Sociais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Separado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Fixo com Glassmorphism -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="#" class="logo" aria-label="CinePool Home">
        <i class="fa-solid fa-film logo-icon"></i>
        <span>Cine<span class="highlight">Pool</span></span>
      </a>

      <!-- Controles de Acessibilidade, Idioma e Tema -->
      <div class="nav-controls">
        <!-- Seletor de Idiomas (i18n) -->
        <div class="lang-selector" role="group" aria-label="Seletor de Idioma">
          <button class="lang-btn active" data-lang="pt-BR" title="Português">PT</button>
          <button class="lang-btn" data-lang="en-US" title="English">EN</button>
          <button class="lang-btn" data-lang="es-ES" title="Español">ES</button>
        </div>

        <!-- Botão Alternar Tema (Claro / Escuro) -->
        <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema claro ou escuro" title="Alternar Tema">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Seção Hero / Banner de Apresentação -->
  <section class="hero">
    <div class="container hero-content">
      <span class="badge" data-i18n="heroBadge">CURADORIA & CRÍTICA</span>
      <h1 data-i18n="heroTitle">Mergulhe na Sétima Arte</h1>
      <p data-i18n="heroSubtitle">Explore obras selecionadas, análises críticas e descubra sua próxima sessão de cinema.</p>
      
      <!-- Aviso de Status da API (Demo vs Live) -->
      <div id="api-status" class="api-badge"></div>
    </div>
  </section>

  <!-- Conteúdo Principal -->
  <main class="container main-content">
    
    <!-- Filtro de Gêneros -->
    <section class="filter-section" aria-label="Filtro de Gêneros Cinematográficos">
      <div class="filter-header">
        <h2 data-i18n="filterTitle">Explorar por Gênero</h2>
      </div>
      <div class="genre-bar" id="genre-bar">
        <button class="genre-btn active" data-genre="all" data-i18n="genreAll">Em Alta</button>
        <button class="genre-btn" data-genre="27" data-i18n="genreHorror">Terror</button>
        <button class="genre-btn" data-genre="80" data-i18n="genreCrime">Policial</button>
        <button class="genre-btn" data-genre="35" data-i18n="genreComedy">Humor</button>
        <button class="genre-btn" data-genre="28" data-i18n="genreAction">Ação</button>
        <button class="genre-btn" data-genre="878" data-i18n="genreSciFi">Ficção Científica</button>
      </div>
    </section>

    <!-- Grid de Filmes -->
    <section aria-live="polite">
      <div id="movies-grid" class="movies-grid">
        <!-- Os cards serão injetados dinamicamente via script.js -->
      </div>
    </section>

  </main>

  <!-- Modal de Crítica e Detalhes do Filme -->
  <div id="movie-modal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-card">
      <button id="close-modal" class="close-btn" aria-label="Fechar janela">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modal-body" class="modal-body">
        <!-- Conteúdo dinâmico do modal -->
      </div>
    </div>
  </div>

  <!-- Rodapé com 3 Mídias Sociais Animadas -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <span class="logo"><i class="fa-solid fa-film logo-icon"></i> Cine<span class="highlight">Pool</span></span>
        <p data-i18n="footerDesc">Projeto didático de Desenvolvimento Web, UI/UX e Crítica Cinematográfica.</p>
      </div>

      <!-- 3 Ícones Sociais Animados -->
      <div class="social-links" aria-label="Redes Sociais">
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-icon instagram" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-icon youtube" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="social-icon twitter" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 CinePool. <span data-i18n="footerRights">Todos os direitos reservados.</span></p>
    </div>
  </footer>

  <!-- Widget Oficial VLibras (Acessibilidade em Língua Brasileira de Sinais) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- JavaScript Separado -->
  <script src="script.js"></script>
</body>
</html>
